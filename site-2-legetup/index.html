  <body class="bg-[#FDFCF0] text-[#433E37] antialiased selection:bg-[#D97757] selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <!-- ════════════════════════════════════════════════════════════════════
         FIREBASE SITE GUARD — Vérifie si le site est actif au chargement
         Si actif:false dans Firestore → affiche "Site Indisponible"
         ════════════════════════════════════════════════════════════════════ -->
    <script>
      (function() {
        var SITE_ID = 'legetup';
        var ADMIN_URL = 'https://sites-clients.vercel.app';

        // Overlay immédiat (synchrone) — bloque visuellement le site
        var overlay = document.createElement('div');
        overlay.id = 'site-guard';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#0f172a;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Inter,system-ui,-apple-system,sans-serif;color:#e2e8f0;text-align:center;transition:opacity 0.4s ease';
        overlay.innerHTML = '<div style="display:flex;flex-direction:column;align-items:center;gap:16px"><svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><p style="font-size:14px;color:#94a3b8;margin:0">Vérification du site...</p></div>';
        document.body.prepend(overlay);

        // Vérification Firebase async
        (async function() {
          try {
            var mods = await Promise.all([
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js')
            ]);
            var app = mods[0].initializeApp({apiKey:'AIzaSyD4b0DYPMFSawWSRfCIrdbk28rys0fEnU8',authDomain:'sites-clients-admin.firebaseapp.com',projectId:'sites-clients-admin'});
            var db = mods[1].getFirestore(app);
            var snap = await mods[1].getDoc(mods[1].doc(db, 'sites', SITE_ID));

            if (snap.exists() && snap.data().actif === false) {
              // Site désactivé → remplacer la page
              document.documentElement.innerHTML = '<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Site Indisponible</title><style>*{margin:0;padding:0;box-sizing:border-box}body{background:#0f172a;color:#e2e8f0;font-family:Inter,system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}.card{max-width:440px;width:100%}.icon{width:64px;height:64px;margin:0 auto 24px;border-radius:50%;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);display:flex;align-items:center;justify-content:center}.icon svg{width:32px;height:32px;stroke:#ef4444;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}h1{font-size:24px;font-weight:700;letter-spacing:-0.02em;margin-bottom:8px}p{font-size:14px;color:#94a3b8;line-height:1.6;margin-bottom:24px}.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;background:#1e293b;border:1px solid #334155;border-radius:8px;color:#e2e8f0;font-size:14px;font-weight:500;text-decoration:none;transition:all 0.2s}.btn:hover{background:#334155;border-color:#475569}</style></head><body><div class="card"><div class="icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="15" x2="9" y1="9" y2="15"/><line x1="9" x2="15" y1="9" y2="15"/></svg></div><h1>Site Indisponible</h1><p>Ce site a été désactivé par l\'administrateur. Il n\'est plus accessible pour le moment.</p><a class="btn" href="' + ADMIN_URL + '"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Retour au panneau d\'administration</a></div></body></html>';
              return;
            }
          } catch(e) {
            console.warn('[Site Guard] Erreur Firebase, site autorisé:', e);
          }
          // Site actif ou erreur → masquer l'overlay
          overlay.style.opacity = '0';
          setTimeout(function() { overlay.remove(); }, 400);
        })();
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
