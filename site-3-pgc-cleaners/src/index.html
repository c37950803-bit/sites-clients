<!doctype html>
<html lang="fr" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <title>PROFESSIONNAL GLOBAL CLEANERS - Yaoundé (Bonas) | Nettoyage & Déménagement</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Services de nettoyage professionnel, fin de chantier, meubles, moquettes, vitres, véhicules, phytosanitaire et déménagement à Yaoundé, quartier Bonas. Réservation et suivi en ligne." />
    <!-- Bootstrap 5.3.3 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Polices Google Fonts : Inter (Grotesque Suisse) & Space Mono (Folios / Indexation) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>
  <body class="bg-white text-dark">
    <!-- ════════════════════════════════════════════════════════════════════
         FIREBASE SITE GUARD — Vérifie si le site est actif au chargement
         Si actif:false dans Firestore → affiche "Site Indisponible"
         ════════════════════════════════════════════════════════════════════ -->
    <script>
      (function() {
        var SITE_ID = 'pgc-cleaners';
        var ERROR_URL = 'https://sites-clients.vercel.app/error.html';

        var overlay = document.createElement('div');
        overlay.id = 'site-guard';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:Inter,system-ui,-apple-system,sans-serif;color:#111;text-align:center;transition:opacity 0.3s ease';
        overlay.innerHTML = '<p style="font-size:14px;color:#666">Chargement...</p>';
        document.body.prepend(overlay);

        (async function() {
          try {
            var mods = await Promise.all([
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js'),
              import('https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js')
            ]);
            var app = mods[0].initializeApp({apiKey:'AIzaSyD4b0DYPMFSawWSRfCIrdbk28rys0fEnU8',authDomain:'sites-clients-admin.firebaseapp.com',projectId:'sites-clients-admin'});
            var db = mods[1].getFirestore(app);
            var snap = await mods[1].getDoc(mods[1].doc(db, 'sites', SITE_ID));

            if (snap.exists() && snap.data().actif === false) {
              window.location.replace(ERROR_URL);
              return;
            }
          } catch(e) {
            console.warn('[Site Guard] Erreur Firebase, site autorisé:', e);
          }
          overlay.style.opacity = '0';
          setTimeout(function() { overlay.remove(); }, 300);
        })();
      })();
    </script>
    <app-root></app-root>
  </body>
</html>
