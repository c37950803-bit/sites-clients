<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Site Indisponible</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <div class="error-page">

    <!-- SVG inline : icone erreur / X -->
    <div class="error-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="15" x2="9" y1="9" y2="15"/>
        <line x1="9" x2="15" y1="9" y2="15"/>
      </svg>
    </div>

    <!-- Code erreur -->
    <div class="error-code">404</div>

    <!-- Titre -->
    <h1 class="error-title">Site Indisponible</h1>

    <!-- Description -->
    <p class="error-desc">
      Ce site a été désactivé par l'administrateur.
      Il n'est plus accessible pour le moment.
    </p>

    <!-- Bouton retour admin -->
    <a href="index.html" class="error-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m12 19-7-7 7-7"/>
        <path d="M19 12H5"/>
      </svg>
      <span>Retour au panneau d'administration</span>
    </a>

  </div>

</body>
</html>
